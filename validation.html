<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NNT Comparator Validation Report</title><style>body{font:16px/1.55 system-ui;max-width:980px;margin:40px auto;padding:0 20px;color:#173247}h1{color:#092c43}a{color:#0b8a7d}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #d6e3e8;padding:9px;text-align:left}.pass{color:#087467;font-weight:800}.fail{color:#b42318;font-weight:800}.summary{font-size:1.2rem;font-weight:800;margin:18px 0}</style></head><body><p><a href="index.html">← NNT Comparator</a></p><h1>Known-answer validation</h1><p>Standalone v1.3.0 · Build 2026.09.28. These tests independently verify the reciprocal-of-absolute-difference engine used for NNT and NNH.</p><div id="summary" class="summary">Running…</div><table><thead><tr><th>Test</th><th>Expected</th><th>Calculated</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><script>
function calc(measure,c,t){const d=measure==='survival'?t-c:c-t;if(d===0)return{metric:'∞',value:null,diff:0};return{metric:d>0?'NNT':'NNH',value:100/Math.abs(d),diff:Math.abs(d)}}
const tests=[
['POP-RT BFFS','survival',81.2,95.0,'NNT',7.25],['POP-RT DFS','survival',77.2,89.5,'NNT',8.13],['POP-RT DMFS','survival',89.2,95.9,'NNT',14.93],['SPPORT add ADT','survival',70.9,81.3,'NNT',9.62],['SPPORT add pelvic nodes','survival',81.3,87.4,'NNT',16.39],['SPPORT full strategy','survival',70.9,87.4,'NNT',6.06],['POP-RT late GU harm','event',7.5,17.7,'NNH',9.80],['POP-RT late GI harm','event',3.8,6.5,'NNH',37.04],['SPPORT acute G2+ add nodes','event',37.7,44.6,'NNH',14.49],['No difference','survival',50,50,'∞',null],['Custom benefit','event',30,20,'NNT',10.00],['Custom harm','survival',90,80,'NNH',10.00]];
let passed=0;const rows=document.getElementById('rows');for(const [name,m,c,t,em,ev] of tests){const got=calc(m,c,t),ok=got.metric===em&&(ev===null?got.value===null:Math.abs(got.value-ev)<0.005);if(ok)passed++;const tr=document.createElement('tr');tr.innerHTML=`<td>${name}</td><td>${em}${ev===null?'':` ${ev.toFixed(2)}`}</td><td>${got.metric}${got.value===null?'':` ${got.value.toFixed(2)}`}</td><td class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</td>`;rows.appendChild(tr)}document.getElementById('summary').textContent=`${passed}/${tests.length} tests passed`;document.getElementById('summary').className=`summary ${passed===tests.length?'pass':'fail'}`;
</script></body></html>
